name: Build HarmoniaAI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17 for SDK manager
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 30
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-30" "build-tools;30.0.3"

      - name: Switch to Java 11 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle 6.7.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '6.7.1'

      - name: Normalize generated voice control source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/harmonia/ai/ChatActivity.java")
          s = p.read_text().replace("\\nimport", "\nimport")
          marker = "    private TextView languageStatus;\n"
          if "private LinearLayout voicePanel;" not in s:
              fields = ("    private LinearLayout voicePanel;\n"
                        "    private SeekBar volumeSeek;\n"
                        "    private SeekBar rateSeek;\n"
                        "    private SeekBar pitchSeek;\n"
                        "    private TextView voiceValues;\n"
                        "    private SharedPreferences voicePrefs;\n"
                        "    private float voiceVolume=0.88f;\n"
                        "    private float voiceRate=0.84f;\n"
                        "    private float voicePitch=0.96f;\n")
              s = s.replace(marker, marker + fields)
          p.write_text(s)
          PY

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare named APK
        run: cp app/build/outputs/apk/debug/app-debug.apk HarmoniaAI_MatchingEngine.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HarmoniaAI-matching-engine-apk
          path: HarmoniaAI_MatchingEngine.apk
          if-no-files-found: error

      - name: Publish direct-download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete harmonia-matching-v1 -y --cleanup-tag || true
          gh release create harmonia-matching-v1 HarmoniaAI_MatchingEngine.apk \
            --title "HarmoniaAI Matching Engine" \
            --notes "Version avec moteur de compatibilité explicable, critères éliminatoires et apprentissage progressif des préférences."
